<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universe — See the shape of the noise</title>
  <meta name="description" content="Enter the Universe to explore an ultra-realistic 3D Moon and space simulation.">
  
  <!-- Tailwind CSS, Three.js, & Iconify -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    :root {
      --bg: #000000;
      --fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #000000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-serif-instrument {
      font-family: 'Instrument Serif', serif;
    }

    /* Video Background */
    #hero-video {
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .liquid-glass {
      background: rgba(0, 0, 0, 0.25);
      background-blend-mode: luminosity;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.18) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.18) 80%,
        rgba(255, 255, 255, 0.5) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-circle {
      background-blend-mode: luminosity;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.22) 30%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0.22) 70%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Transition states */
    .view-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(-10px);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .view-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #space-canvas {
      touch-action: none;
      cursor: grab;
    }
    #space-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-black text-white selection:bg-white selection:text-black font-sans">
  <div class="h-[100dvh] max-h-[100dvh] w-full flex flex-col justify-between overflow-hidden relative">
    
    <!-- 1. Background Video (Boy standing looking up at the sky) -->
    <video id="hero-video" class="absolute inset-0 w-full h-full object-cover object-bottom pointer-events-none z-0"
           muted autoplay loop playsinline preload="auto"></video>

    <!-- 2. Interactive 3D Space Canvas (Planets & Ultra-Realistic Moon) -->
    <canvas id="space-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none opacity-0 transition-opacity duration-1000"></canvas>

    <!-- Top Navbar -->
    <header class="relative z-30 px-3 sm:px-6 pt-3 sm:pt-4 md:pt-6 shrink-0">
      <div class="liquid-glass rounded-full max-w-5xl mx-auto pl-4 pr-2 py-1.5 md:pl-6 md:pr-2.5 md:py-2 flex items-center justify-between">
        <!-- Left Group -->
        <div class="flex items-center gap-2">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-5 h-5 md:w-6 md:h-6 shrink-0">
            <path d="M4.21 16.5 A9 9 0 0 1 16.5 4.21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16.5 4.21 A9 9 0 0 1 19.79 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 2.3"/>
            <path d="M19.79 16.5 A9 9 0 0 1 4.21 16.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 4.7"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          </svg>
          <span class="font-semibold text-base md:text-lg tracking-tight">Universe</span>
        </div>

        <!-- Right Group -->
        <div class="flex items-center gap-3">
          <!-- Space Mode Indicator (visible when in space) -->
          <div id="space-hint" class="hidden items-center gap-2 text-[11px] sm:text-xs text-white/80 px-3 py-1 rounded-full bg-white/10 border border-white/15">
            <iconify-icon icon="lucide:hand" class="text-sm animate-pulse"></iconify-icon>
            <span>Touch & Drag to Rotate</span>
          </div>

          <button id="main-action-btn" onclick="toggleUniverseMode()" class="bg-white rounded-full px-4 py-1.5 md:px-5 md:py-2 text-black text-xs md:text-sm font-semibold whitespace-nowrap hover:scale-105 active:scale-95 transition-transform shadow-lg">
            Enter Universe
          </button>
        </div>
      </div>
    </header>

    <!-- Center Hero View (Landing with Boy) -->
    <main id="hero-view" class="relative z-30 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-2 text-center my-auto w-full max-w-4xl mx-auto shrink min-h-0 view-visible">
      <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-serif-instrument tracking-tight leading-[1.1] md:whitespace-nowrap mb-3 md:mb-4 px-1"
          style="text-shadow: 0 0 54px rgba(0, 0, 0, 0.8), 0 4px 24px rgba(0, 0, 0, 0.6);">
        See the shape of the <em class="italic">universe</em>
      </h1>
      
      <p class="text-white/80 text-xs sm:text-sm md:text-base leading-relaxed max-w-xl md:whitespace-nowrap mb-8 md:mb-10 px-3"
         style="text-shadow: 0 0 28px rgba(0, 0, 0, 0.7), 0 1px 10px rgba(0, 0, 0, 0.5);">
        Gaze upward to travel through the solar system and observe the Moon in realistic detail.
      </p>

      <!-- Action Button Pill -->
      <div class="max-w-xs sm:max-w-sm w-full px-2">
        <button onclick="enterUniverse()"
                class="w-full liquid-glass rounded-full p-2 pl-6 pr-2.5 flex items-center justify-between gap-3 shadow-2xl hover:scale-105 active:scale-95 transition-all group">
          <div class="flex items-center gap-2.5 text-left">
            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
            <span class="text-xs sm:text-sm text-white font-medium">Enter Universe</span>
          </div>
          <div class="bg-white rounded-full p-2.5 text-black flex items-center justify-center group-hover:translate-x-0.5 transition-transform">
            <iconify-icon icon="lucide:arrow-up-right" class="text-base"></iconify-icon>
          </div>
        </button>
      </div>
    </main>

    <!-- Empty Bottom Spacer (Social icons completely removed as requested) -->
    <div class="h-6 shrink-0 relative z-20"></div>
  </div>

  <script>
    // Video Setup
    const video = document.getElementById('hero-video');
    video.src = "https://designerstephen.github.io/public-assets/videos/observe-hero.mp4";
    video.playbackRate = 0.5;

    let inSpaceMode = false;
    const heroView = document.getElementById('hero-view');
    const spaceCanvas = document.getElementById('space-canvas');
    const mainActionBtn = document.getElementById('main-action-btn');
    const spaceHint = document.getElementById('space-hint');

    function toggleUniverseMode() {
      if (inSpaceMode) {
        exitUniverse();
      } else {
        enterUniverse();
      }
    }

    function enterUniverse() {
      inSpaceMode = true;

      // 1. Hide Hero view smoothly
      heroView.classList.remove('view-visible');
      heroView.classList.add('view-hidden');

      // 2. Animate background video upward & fade into pure 3D space
      video.style.transform = 'scale(1.8) translateY(-30%)';
      video.style.opacity = '0';

      // 3. Make 3D space canvas interactive and visible
      spaceCanvas.classList.remove('pointer-events-none');
      spaceCanvas.classList.add('pointer-events-auto');
      spaceCanvas.classList.remove('opacity-0');
      spaceCanvas.classList.add('opacity-100');

      mainActionBtn.textContent = "Back to Earth";
      spaceHint.classList.remove('hidden');
      spaceHint.classList.add('flex');

      if (!threeInitialized) {
        initThreeSpace();
      }

      // 4. Trigger cinematic fly-through camera animation into space
      startFlyThroughAnimation();
    }

    function exitUniverse() {
      inSpaceMode = false;

      // Reset video
      video.style.transform = 'translate3d(0, 0, 0) scale(1)';
      video.style.opacity = '1';

      // Hide canvas
      spaceCanvas.classList.remove('pointer-events-auto');
      spaceCanvas.classList.add('pointer-events-none');
      spaceCanvas.classList.remove('opacity-100');
      spaceCanvas.classList.add('opacity-0');

      mainActionBtn.textContent = "Enter Universe";
      spaceHint.classList.remove('flex');
      spaceHint.classList.add('hidden');

      // Show Hero view
      heroView.classList.remove('view-hidden');
      heroView.classList.add('view-visible');
    }

    // ==========================================
    // THREE.JS 3D SPACE & ULTRA-REALISTIC MOON
    // ==========================================
    let threeInitialized = false;
    let scene, camera, renderer;
    let moonMesh, starField, planetGroup;
    let planets = [];

    // Interaction controls
    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let targetRotationX = 0;
    let targetRotationY = 0;
    let currentRotationX = 0;
    let currentRotationY = 0;
    let isUserInteracting = false;
    let userInteractionTimeout = null;

    // Fly-through animation variables
    let isFlying = false;
    let flyProgress = 0;
    const flyDuration = 2200; // ms
    let flyStartTime = 0;

    function initThreeSpace() {
      threeInitialized = true;
      const canvas = document.getElementById('space-canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Scene & Camera
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
      camera.position.set(0, 0, 80); // Starts far back for fly-through

      // Renderer
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      // 1. STARFIELD & COSMIC NEBULA DUST
      const starGeo = new THREE.BufferGeometry();
      const starCount = 2400;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 700;
        starPositions[i + 1] = (Math.random() - 0.5) * 700;
        starPositions[i + 2] = -Math.random() * 450 - 10;

        const colorType = Math.random();
        if (colorType > 0.85) {
          // Blue star
          starColors[i] = 0.82; starColors[i + 1] = 0.90; starColors[i + 2] = 1.0;
        } else if (colorType > 0.7) {
          // Amber/Gold star
          starColors[i] = 1.0; starColors[i + 1] = 0.84; starColors[i + 2] = 0.65;
        } else {
          // Pure white star
          starColors[i] = 0.96; starColors[i + 1] = 0.96; starColors[i + 2] = 0.96;
        }
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
      const starMat = new THREE.PointsMaterial({
        size: 1.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.95
      });
      starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);

      // 2. SOLAR SYSTEM PLANETS VISIBLE DURING SPACE FLY-THROUGH
      planetGroup = new THREE.Group();
      scene.add(planetGroup);

      function createPlanet(size, color, x, y, z, hasRing = false) {
        const pGeo = new THREE.SphereGeometry(size, 32, 32);
        const pMat = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.7,
          metalness: 0.1
        });
        const mesh = new THREE.Mesh(pGeo, pMat);
        mesh.position.set(x, y, z);
        planetGroup.add(mesh);

        if (hasRing) {
          const ringGeo = new THREE.RingGeometry(size * 1.4, size * 2.2, 48);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0xc4b496,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2.5;
          mesh.add(ring);
        }

        planets.push(mesh);
        return mesh;
      }

      // Distant Solar System Planets
      createPlanet(3.8, 0xff9900, -24, 16, 45);   // Glowing Sun / Gas Giant
      createPlanet(1.4, 0x2563eb, 19, -12, 35);   // Blue Earth
      createPlanet(0.9, 0xdc2626, -15, -9, 25);   // Red Mars
      createPlanet(2.8, 0xd97706, 26, 13, 15, true); // Saturn with Rings
      createPlanet(3.2, 0xa16207, -22, -14, 5);  // Jupiter

      // 3. ULTRA-REALISTIC PROCEDURAL NASA MOON TEXTURE & SHADING
      const textureData = generateRealisticMoonTextures();

      const moonGeo = new THREE.SphereGeometry(1.65, 128, 128);
      const moonMat = new THREE.MeshStandardMaterial({
        map: textureData.albedo,
        bumpMap: textureData.bump,
        bumpScale: 0.055,
        roughnessMap: textureData.roughness,
        roughness: 0.85,
        metalness: 0.05
      });

      moonMesh = new THREE.Mesh(moonGeo, moonMat);
      moonMesh.position.set(0, 0, 0);
      scene.add(moonMesh);

      // 4. CELESTIAL LIGHTING (Direct sunlight casting realistic crater shadows)
      const ambientLight = new THREE.AmbientLight(0x1c1c28, 0.75);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffffff, 2.6);
      sunLight.position.set(7, 3.5, 5);
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight(0x4466aa, 0.45);
      rimLight.position.set(-7, -2, -4);
      scene.add(rimLight);

      // 5. TOUCH & MOUSE INTERACTIVE ROTATION EVENTS
      setupInteractionListeners(canvas);

      // 6. ANIMATION LOOP
      function animate() {
        requestAnimationFrame(animate);

        // Fly-through camera interpolation
        if (isFlying) {
          const now = performance.now();
          const elapsed = now - flyStartTime;
          flyProgress = Math.min(elapsed / flyDuration, 1);

          // Smooth cubic ease out
          const ease = 1 - Math.pow(1 - flyProgress, 3);
          
          // Camera flies from z=80 down to z=4.4
          camera.position.z = 80 - ease * (80 - 4.4);
          camera.position.x = Math.sin((1 - ease) * Math.PI) * 4;
          camera.position.y = Math.cos((1 - ease) * Math.PI) * 2;

          // Planets drift past during fly-through
          planets.forEach((p, idx) => {
            p.position.z += 0.05;
            p.rotation.y += 0.005 * (idx + 1);
          });

          if (flyProgress >= 1) {
            isFlying = false;
            camera.position.set(0, 0, 4.4);
          }
        }

        // Smooth damping rotation on the Moon
        currentRotationX += (targetRotationX - currentRotationX) * 0.1;
        currentRotationY += (targetRotationY - currentRotationY) * 0.1;

        if (moonMesh) {
          moonMesh.rotation.y = currentRotationY;
          moonMesh.rotation.x = currentRotationX;

          // Continuous gentle auto-rotation when user is not touching/dragging
          if (!isUserInteracting && !isDragging) {
            targetRotationY += 0.0018;
          }
        }

        if (starField) {
          starField.rotation.y += 0.0002;
        }

        renderer.render(scene, camera);
      }
      animate();

      // Window resize
      window.addEventListener('resize', onWindowResize);
    }

    function startFlyThroughAnimation() {
      isFlying = true;
      flyStartTime = performance.now();
      flyProgress = 0;
      targetRotationX = 0.05;
      targetRotationY = 0;
      currentRotationX = 0;
      currentRotationY = 0;
    }

    // ==========================================
    // ULTRA-REALISTIC LUNAR TEXTURE GENERATOR
    // ==========================================
    function generateRealisticMoonTextures() {
      const width = 2048;
      const height = 1024;

      // --- Albedo Canvas (Color & Maria) ---
      const albedoCanvas = document.createElement('canvas');
      albedoCanvas.width = width;
      albedoCanvas.height = height;
      const aCtx = albedoCanvas.getContext('2d');

      // Base realistic lunar regolith background
      const baseGrad = aCtx.createLinearGradient(0, 0, 0, height);
      baseGrad.addColorStop(0, '#9c9a96');
      baseGrad.addColorStop(0.5, '#b5b3af');
      baseGrad.addColorStop(1, '#8e8c88');
      aCtx.fillStyle = baseGrad;
      aCtx.fillRect(0, 0, width, height);

      // Micro-surface noise
      const imgData = aCtx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 22;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
      }
      aCtx.putImageData(imgData, 0, 0);

      // Photorealistic Lunar Maria (Oceanus Procellarum, Mare Tranquillitatis, Imbrium, etc.)
      aCtx.fillStyle = 'rgba(40, 38, 42, 0.68)';
      const maria = [
        { x: 550, y: 380, rx: 280, ry: 190 }, // Oceanus Procellarum
        { x: 800, y: 320, rx: 200, ry: 160 }, // Mare Imbrium
        { x: 1050, y: 360, rx: 180, ry: 140 }, // Mare Serenitatis
        { x: 1250, y: 440, rx: 220, ry: 170 }, // Mare Tranquillitatis
        { x: 1480, y: 410, rx: 140, ry: 130 }, // Mare Crisium
        { x: 1380, y: 560, rx: 170, ry: 130 }, // Mare Fecunditatis
        { x: 700, y: 580, rx: 180, ry: 140 },  // Mare Nubium
        { x: 950, y: 620, rx: 130, ry: 100 }   // Mare Humorum
      ];

      maria.forEach(m => {
        aCtx.beginPath();
        aCtx.ellipse(m.x, m.y, m.rx, m.ry, Math.random() * 0.4, 0, Math.PI * 2);
        aCtx.filter = 'blur(45px)';
        aCtx.fill();
      });
      aCtx.filter = 'none';

      // --- Bump & Crater Canvas ---
      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = width;
      bumpCanvas.height = height;
      const bCtx = bumpCanvas.getContext('2d');
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, width, height);

      // Realistic impact craters across lunar surface
      for (let i = 0; i < 1500; i++) {
        const cx = Math.random() * width;
        const cy = Math.random() * height;
        const radius = Math.pow(Math.random(), 3) * 32 + 2;

        // Crater rim (bright high elevation)
        bCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        bCtx.lineWidth = Math.max(1, radius * 0.18);
        bCtx.beginPath();
        bCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        bCtx.stroke();

        // Crater interior depth
        bCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        bCtx.beginPath();
        bCtx.arc(cx + radius * 0.15, cy + radius * 0.15, radius * 0.82, 0, Math.PI * 2);
        bCtx.fill();

        // Also add crater to albedo
        aCtx.strokeStyle = 'rgba(230, 230, 235, 0.45)';
        aCtx.lineWidth = Math.max(1, radius * 0.15);
        aCtx.beginPath();
        aCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        aCtx.stroke();
      }

      // Prominent Rayed Craters (Tycho & Copernicus with bright rays)
      function drawRayedCrater(x, y, radius, rayCount, rayLength) {
        // Center crater
        aCtx.fillStyle = '#ffffff';
        aCtx.beginPath();
        aCtx.arc(x, y, radius, 0, Math.PI * 2);
        aCtx.fill();

        // Filamentous rays
        for (let a = 0; a < Math.PI * 2; a += (Math.PI * 2) / rayCount) {
          const len = rayLength * (0.6 + Math.random() * 0.8);
          aCtx.strokeStyle = 'rgba(240, 240, 255, 0.38)';
          aCtx.lineWidth = Math.random() * 2 + 1;
          aCtx.beginPath();
          aCtx.moveTo(x, y);
          aCtx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
          aCtx.stroke();
        }
      }

      drawRayedCrater(900, 750, 14, 36, 480); // Tycho Crater
      drawRayedCrater(700, 360, 12, 28, 320); // Copernicus Crater
      drawRayedCrater(560, 420, 9, 20, 240);  // Kepler Crater

      // Textures creation
      const albedoTex = new THREE.CanvasTexture(albedoCanvas);
      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      const roughnessTex = new THREE.CanvasTexture(bumpCanvas);

      return {
        albedo: albedoTex,
        bump: bumpTex,
        roughness: roughnessTex
      };
    }

    // ==========================================
    // TOUCH & MOUSE ROTATION LOGIC (POINTER EVENTS)
    // ==========================================
    function setupInteractionListeners(canvas) {
      function onPointerDown(e) {
        if (!inSpaceMode) return;
        isDragging = true;
        isUserInteracting = true;
        clearTimeout(userInteractionTimeout);

        previousPointerPosition = { x: e.clientX, y: e.clientY };
      }

      function onPointerMove(e) {
        if (!isDragging || !inSpaceMode) return;

        const deltaX = e.clientX - previousPointerPosition.x;
        const deltaY = e.clientY - previousPointerPosition.y;

        // Smooth rotation sensitivity
        targetRotationY += deltaX * 0.007;
        targetRotationX += deltaY * 0.007;

        // Clamp vertical pitch
        targetRotationX = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, targetRotationX));

        previousPointerPosition = { x: e.clientX, y: e.clientY };
      }

      function onPointerUp() {
        isDragging = false;
        clearTimeout(userInteractionTimeout);
        // Resume slow auto-rotation after 3.5 seconds of inactivity
        userInteractionTimeout = setTimeout(() => {
          isUserInteracting = false;
        }, 3500);
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
  </script>
</body>
</html>
