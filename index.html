<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universe — See the shape of the noise</title>
  <meta name="description" content="Explore the solar system in real-time 3D orbit with photorealistic textures.">
  
  <!-- Tailwind CSS, Three.js, & Iconify -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    :root {
      --bg: #000000;
      --fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #000000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-serif-instrument {
      font-family: 'Instrument Serif', serif;
    }

    /* Video Background */
    #hero-video {
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .liquid-glass {
      background: rgba(0, 0, 0, 0.35);
      background-blend-mode: luminosity;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.18) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.18) 80%,
        rgba(255, 255, 255, 0.5) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Transition states */
    .view-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(-10px);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .view-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #space-canvas {
      touch-action: none;
      cursor: grab;
    }
    #space-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-black text-white selection:bg-white selection:text-black font-sans">
  <div class="h-[100dvh] max-h-[100dvh] w-full flex flex-col justify-between overflow-hidden relative">
    
    <!-- 1. Background Video (Boy standing looking up at the sky) -->
    <video id="hero-video" class="absolute inset-0 w-full h-full object-cover object-bottom pointer-events-none z-0"
           muted autoplay loop playsinline preload="auto"></video>

    <!-- 2. Interactive 3D Solar System & Realistic Planet Canvas -->
    <canvas id="space-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none opacity-0 transition-opacity duration-1000"></canvas>

    <!-- Top Navbar -->
    <header class="relative z-30 px-3 sm:px-6 pt-3 sm:pt-4 md:pt-6 shrink-0">
      <div class="liquid-glass rounded-full max-w-5xl mx-auto pl-4 pr-2 py-1.5 md:pl-6 md:pr-2.5 md:py-2 flex items-center justify-between">
        <!-- Left Group -->
        <div class="flex items-center gap-2">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-5 h-5 md:w-6 md:h-6 shrink-0">
            <path d="M4.21 16.5 A9 9 0 0 1 16.5 4.21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16.5 4.21 A9 9 0 0 1 19.79 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 2.3"/>
            <path d="M19.79 16.5 A9 9 0 0 1 4.21 16.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 4.7"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          </svg>
          <span class="font-semibold text-base md:text-lg tracking-tight">Universe</span>
        </div>

        <!-- Center Active Planet Badge (Clean: No 2K or 9 planet mentions) -->
        <div id="active-planet-badge" class="hidden items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs sm:text-sm font-medium text-white shadow-lg">
          <span id="active-planet-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="active-planet-name">Solar System</span>
        </div>

        <!-- Right Group -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Zoom to Orbit View Button (Shown when inspecting a planet) -->
          <button id="orbit-view-btn" onclick="zoomToSolarOrbit()" class="hidden liquid-glass rounded-full px-3 py-1 sm:px-4 sm:py-1.5 text-xs sm:text-sm font-medium text-white/90 hover:text-white items-center gap-1.5 transition hover:bg-white/10">
            <iconify-icon icon="lucide:orbit" class="text-sm"></iconify-icon>
            <span>Orbit View</span>
          </button>

          <!-- Main Action Button -->
          <button id="main-action-btn" onclick="toggleUniverseMode()" class="bg-white rounded-full px-4 py-1.5 md:px-5 md:py-2 text-black text-xs md:text-sm font-semibold whitespace-nowrap hover:scale-105 active:scale-95 transition-transform shadow-lg">
            Enter Universe
          </button>
        </div>
      </div>
    </header>

    <!-- Center Hero View (Landing with Boy) -->
    <main id="hero-view" class="relative z-30 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-2 text-center my-auto w-full max-w-4xl mx-auto shrink min-h-0 view-visible">
      <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-serif-instrument tracking-tight leading-[1.1] md:whitespace-nowrap mb-3 md:mb-4 px-1"
          style="text-shadow: 0 0 54px rgba(0, 0, 0, 0.8), 0 4px 24px rgba(0, 0, 0, 0.6);">
        See the shape of the <em class="italic">universe</em>
      </h1>
      
      <p class="text-white/80 text-xs sm:text-sm md:text-base leading-relaxed max-w-xl md:whitespace-nowrap mb-8 md:mb-10 px-3"
         style="text-shadow: 0 0 28px rgba(0, 0, 0, 0.7), 0 1px 10px rgba(0, 0, 0, 0.5);">
        Gaze upward to travel through the solar system and observe the planets in photorealistic detail.
      </p>

      <!-- Action Button Pill -->
      <div class="max-w-xs sm:max-w-sm w-full px-2">
        <button onclick="enterUniverse()"
                class="w-full liquid-glass rounded-full p-2 pl-6 pr-2.5 flex items-center justify-between gap-3 shadow-2xl hover:scale-105 active:scale-95 transition-all group">
          <div class="flex items-center gap-2.5 text-left">
            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
            <span class="text-xs sm:text-sm text-white font-medium">Enter Universe</span>
          </div>
          <div class="bg-white rounded-full p-2.5 text-black flex items-center justify-center group-hover:translate-x-0.5 transition-transform">
            <iconify-icon icon="lucide:arrow-up-right" class="text-base"></iconify-icon>
          </div>
        </button>
      </div>
    </main>

    <!-- Bottom Instruction / Current Time Bar (Visible in Space Mode) -->
    <div id="space-tap-hint" class="relative z-30 px-4 pb-4 pt-1 text-center hidden opacity-0 transition-opacity duration-700">
      <div class="inline-flex items-center gap-2 text-xs sm:text-sm text-white/80 px-5 py-2 rounded-full liquid-glass shadow-lg">
        <iconify-icon icon="lucide:clock" class="text-sm text-amber-400"></iconify-icon>
        <span id="current-time-display" class="font-medium tracking-wide">See your current time: --:--:--</span>
      </div>
    </div>

    <!-- Empty Spacer for Hero view -->
    <div id="hero-spacer" class="h-6 shrink-0 relative z-20"></div>
  </div>

  <script>
    // Video Setup
    const video = document.getElementById('hero-video');
    video.src = "https://designerstephen.github.io/public-assets/videos/observe-hero.mp4";
    video.playbackRate = 0.5;

    let inSpaceMode = false;
    const heroView = document.getElementById('hero-view');
    const spaceCanvas = document.getElementById('space-canvas');
    const mainActionBtn = document.getElementById('main-action-btn');
    const activePlanetBadge = document.getElementById('active-planet-badge');
    const activePlanetDot = document.getElementById('active-planet-dot');
    const activePlanetName = document.getElementById('active-planet-name');
    const orbitViewBtn = document.getElementById('orbit-view-btn');
    const spaceTapHint = document.getElementById('space-tap-hint');
    const currentTimeDisplay = document.getElementById('current-time-display');
    const heroSpacer = document.getElementById('hero-spacer');

    // Live Clock Updater
    function updateLiveTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      const dateStr = now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
      if (currentTimeDisplay) {
        currentTimeDisplay.textContent = `See your current time: ${timeStr} • ${dateStr}`;
      }
    }
    setInterval(updateLiveTime, 1000);
    updateLiveTime();

    function toggleUniverseMode() {
      if (inSpaceMode) {
        exitUniverse();
      } else {
        enterUniverse();
      }
    }

    function enterUniverse() {
      inSpaceMode = true;

      // 1. Hide Hero view smoothly
      heroView.classList.remove('view-visible');
      heroView.classList.add('view-hidden');

      // 2. Animate background video upward & fade into pure 3D space
      video.style.transform = 'scale(1.8) translateY(-30%)';
      video.style.opacity = '0';

      // 3. Make 3D space canvas interactive and visible
      spaceCanvas.classList.remove('pointer-events-none');
      spaceCanvas.classList.add('pointer-events-auto');
      spaceCanvas.classList.remove('opacity-0');
      spaceCanvas.classList.add('opacity-100');

      mainActionBtn.textContent = "Back to Earth";
      activePlanetBadge.classList.remove('hidden');
      activePlanetBadge.classList.add('flex');
      
      heroSpacer.classList.add('hidden');
      spaceTapHint.classList.remove('hidden');
      setTimeout(() => {
        spaceTapHint.classList.remove('opacity-0');
      }, 100);

      if (!threeInitialized) {
        initThreeSpace();
      }

      // Start in full Solar System Orbit View
      zoomToSolarOrbit();
    }

    function exitUniverse() {
      inSpaceMode = false;

      // Reset video
      video.style.transform = 'translate3d(0, 0, 0) scale(1)';
      video.style.opacity = '1';

      // Hide canvas
      spaceCanvas.classList.remove('pointer-events-auto');
      spaceCanvas.classList.add('pointer-events-none');
      spaceCanvas.classList.remove('opacity-100');
      spaceCanvas.classList.add('opacity-0');

      mainActionBtn.textContent = "Enter Universe";
      activePlanetBadge.classList.remove('flex');
      activePlanetBadge.classList.add('hidden');
      orbitViewBtn.classList.remove('flex');
      orbitViewBtn.classList.add('hidden');
      
      spaceTapHint.classList.add('opacity-0');
      setTimeout(() => {
        spaceTapHint.classList.add('hidden');
        heroSpacer.classList.remove('hidden');
      }, 300);

      // Show Hero view
      heroView.classList.remove('view-hidden');
      heroView.classList.add('view-visible');
    }

    // ==========================================
    // THREE.JS SOLAR SYSTEM & PHOTOREALISTIC PLANETS
    // ==========================================
    let threeInitialized = false;
    let scene, camera, renderer, raycaster, mouse;
    let starField, sunCoronaMesh;
    let celestialBodies = [];
    let focusedBody = null;
    let isOrbitOverview = true;

    // Camera target animation
    let cameraTargetPos = new THREE.Vector3(0, 36, 44);
    let cameraLookAtPos = new THREE.Vector3(0, 0, 0);
    let currentLookAt = new THREE.Vector3(0, 0, 0);

    // Touch & Drag rotation on focused planet
    let isDragging = false;
    let previousPointer = { x: 0, y: 0 };
    let focusedPlanetRotation = { x: 0, y: 0 };
    let isUserInteracting = false;
    let userInteractionTimeout = null;

    // Authentic Astronomical Celestial Configs with Deep Fiery Orange Sun
    const PLANET_CONFIGS = [
      { name: 'sun', label: 'Sun', size: 3.2, orbitRadius: 0, orbitSpeed: 0, color: 0xff6600, emissive: 0xff4400, texture: 'sun_2k.jpg' },
      { name: 'mercury', label: 'Mercury', size: 0.7, orbitRadius: 6.8, orbitSpeed: 0.024, color: 0x9ca3af, texture: 'mercury_2k.jpg' },
      { name: 'venus', label: 'Venus', size: 1.1, orbitRadius: 10.5, orbitSpeed: 0.018, color: 0xf59e0b, texture: 'venus_2k.jpg' },
      { name: 'earth', label: 'Earth', size: 1.25, orbitRadius: 15.0, orbitSpeed: 0.014, color: 0x2563eb, texture: 'earth_2k.jpg' },
      { name: 'moon', label: 'Moon', size: 0.65, orbitRadius: 18.2, orbitSpeed: 0.013, color: 0xd1d5db, texture: 'moon_2k.jpg' },
      { name: 'mars', label: 'Mars', size: 0.85, orbitRadius: 22.0, orbitSpeed: 0.010, color: 0xdc2626, texture: 'mars_2k.jpg' },
      { name: 'jupiter', label: 'Jupiter', size: 2.2, orbitRadius: 28.0, orbitSpeed: 0.007, color: 0xb45309, texture: 'jupiter_2k.jpg' },
      { name: 'saturn', label: 'Saturn', size: 1.9, orbitRadius: 35.0, orbitSpeed: 0.005, color: 0xeab308, hasRing: true, texture: 'saturn_2k.jpg' },
      { name: 'uranus', label: 'Uranus', size: 1.4, orbitRadius: 41.5, orbitSpeed: 0.0035, color: 0x06b6d4, texture: 'uranus_2k.jpg' }
    ];

    function initThreeSpace() {
      threeInitialized = true;
      const canvas = document.getElementById('space-canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 3000);
      camera.position.set(0, 36, 44);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 1. STARFIELD (Fixed: Placed on distant celestial sphere r=750 so NO stars ever render on or in front of planets!)
      const starGeo = new THREE.BufferGeometry();
      const starCount = 3500;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        // Spherical distribution at radius 750 to 950 (infinite deep space background)
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const r = 750 + Math.random() * 200;

        starPositions[i] = r * Math.sin(phi) * Math.cos(theta);
        starPositions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
        starPositions[i + 2] = r * Math.cos(phi);

        const c = Math.random();
        if (c > 0.85) { starColors[i] = 0.85; starColors[i+1] = 0.92; starColors[i+2] = 1.0; }
        else if (c > 0.7) { starColors[i] = 1.0; starColors[i+1] = 0.88; starColors[i+2] = 0.7; }
        else { starColors[i] = 0.98; starColors[i+1] = 0.98; starColors[i+2] = 0.98; }
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
      
      const starMat = new THREE.PointsMaterial({
        size: 1.6,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      });
      starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);

      // 2. CELESTIAL LIGHTING
      const ambientLight = new THREE.AmbientLight(0x282838, 0.9);
      scene.add(ambientLight);

      // Radiant Orange-Gold Solar Light at the Sun's core
      const sunPointLight = new THREE.PointLight(0xff8c00, 4.2, 700, 0.4);
      sunPointLight.position.set(0, 0, 0);
      scene.add(sunPointLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
      fillLight.position.set(30, 25, 20);
      scene.add(fillLight);

      // 3. TEXTURE LOADER & CELESTIAL BODIES
      const textureLoader = new THREE.TextureLoader();
      textureLoader.setCrossOrigin('anonymous');

      PLANET_CONFIGS.forEach((config) => {
        // Orbital Pivot Group
        const orbitGroup = new THREE.Group();
        scene.add(orbitGroup);

        // Glowing Orbital Path Ring
        if (config.orbitRadius > 0) {
          const ringGeo = new THREE.RingGeometry(config.orbitRadius - 0.06, config.orbitRadius + 0.06, 128);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.rotation.x = Math.PI / 2;
          scene.add(ringMesh);
        }

        // Procedural Base Texture (Guarantees instant authentic colors)
        const proceduralTex = generatePlanetTexture(config.name, config.color);

        // Planet Sphere Geometry & Material
        const geo = new THREE.SphereGeometry(config.size, 64, 64);
        let mat;

        if (config.name === 'sun') {
          // Fiery Radiant Orange Sun Material
          mat = new THREE.MeshStandardMaterial({
            map: proceduralTex,
            emissive: 0xff4400,
            emissiveIntensity: 1.4,
            roughness: 0.15,
            metalness: 0.0
          });

          // Sun Blazing Orange Corona Flare Halo
          const coronaGeo = new THREE.SphereGeometry(config.size * 1.25, 32, 32);
          const coronaMat = new THREE.ShaderMaterial({
            vertexShader: `
              varying vec3 vNormal;
              void main() {
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              varying vec3 vNormal;
              void main() {
                float intensity = pow(0.72 - dot(vNormal, vec3(0, 0, 1.0)), 2.4);
                gl_FragColor = vec4(1.0, 0.45, 0.05, 1.0) * intensity * 1.1;
              }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
          });
          sunCoronaMesh = new THREE.Mesh(coronaGeo, coronaMat);
        } else {
          mat = new THREE.MeshStandardMaterial({
            map: proceduralTex,
            bumpMap: proceduralTex,
            bumpScale: 0.045,
            roughness: 0.82,
            metalness: 0.04
          });
        }

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(config.orbitRadius, 0, 0);
        mesh.userData = { config: config, currentAngle: Math.random() * Math.PI * 2 };
        orbitGroup.add(mesh);

        if (config.name === 'sun' && sunCoronaMesh) {
          mesh.add(sunCoronaMesh);
        }

        // Saturn Ring with golden-ice shading
        if (config.hasRing) {
          const sRingGeo = new THREE.RingGeometry(config.size * 1.35, config.size * 2.35, 64);
          const sRingMat = new THREE.MeshBasicMaterial({ color: 0xecd5a4, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
          const sRing = new THREE.Mesh(sRingGeo, sRingMat);
          sRing.rotation.x = Math.PI / 2.3;
          mesh.add(sRing);
        }

        // Asynchronously load genuine 2K Texture pack
        textureLoader.load(
          `./assets/${config.texture}`,
          (tex) => {
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            tex.generateMipmaps = true;
            mat.map = tex;
            if (config.name !== 'sun') {
              mat.bumpMap = tex;
            }
            mat.needsUpdate = true;
          }
        );

        celestialBodies.push({
          config: config,
          mesh: mesh,
          orbitGroup: orbitGroup,
          material: mat
        });
      });

      // 4. INTERACTIVE POINTER LISTENERS
      setupSpaceInteractions(canvas);

      // 5. RENDER & ORBITAL ANIMATION LOOP
      function animate() {
        requestAnimationFrame(animate);

        // Animate Orbits & Rotations
        celestialBodies.forEach(body => {
          if (focusedBody === body) {
            // Selected planet is STATIONARY in orbit so user can inspect it steadily without it moving away!
          } else {
            // Self-rotation on axis
            body.mesh.rotation.y += 0.008;

            // Orbital Revolution around Sun for non-selected planets
            if (body.config.orbitRadius > 0) {
              body.mesh.userData.currentAngle += body.config.orbitSpeed * 0.35;
              const angle = body.mesh.userData.currentAngle;
              body.mesh.position.x = Math.cos(angle) * body.config.orbitRadius;
              body.mesh.position.z = Math.sin(angle) * body.config.orbitRadius;
            }
          }
        });

        // Camera Smooth Lerp to Focused Planet (Framed to fit mobile screens completely without cutting)
        if (focusedBody) {
          const worldPos = new THREE.Vector3();
          focusedBody.mesh.getWorldPosition(worldPos);

          // Calculate distance to guarantee 100% of the planet (and Saturn's rings) fits phone screen without edge clipping
          const aspect = window.innerWidth / window.innerHeight;
          const radiusWithRings = focusedBody.config.hasRing ? focusedBody.config.size * 2.35 : focusedBody.config.size;
          const vFovRad = (camera.fov * Math.PI) / 180;
          
          let camDistance;
          if (aspect < 1) {
            // Mobile Portrait: Horizontal FOV is narrower, calculate distance based on horizontal width with safety margin
            const hFovRad = 2 * Math.atan(Math.tan(vFovRad / 2) * aspect);
            camDistance = (radiusWithRings * 1.55) / Math.tan(hFovRad / 2);
          } else {
            // Landscape Desktop: Calculate based on vertical FOV
            camDistance = (radiusWithRings * 1.4) / Math.tan(vFovRad / 2);
          }

          cameraTargetPos.set(worldPos.x, worldPos.y + (focusedBody.config.size * 0.15), worldPos.z + camDistance);
          cameraLookAtPos.copy(worldPos);

          // Apply user touch rotation to the stationary focused planet
          focusedBody.mesh.rotation.y += (focusedPlanetRotation.y - focusedBody.mesh.rotation.y) * 0.1;
          focusedBody.mesh.rotation.x += (focusedPlanetRotation.x - focusedBody.mesh.rotation.x) * 0.1;
        } else if (isOrbitOverview) {
          // Wide angle view showing the solar system in orbit
          const aspect = window.innerWidth / window.innerHeight;
          const isMobile = aspect < 1 || window.innerWidth < 768;
          cameraTargetPos.set(0, isMobile ? 58 : 38, isMobile ? 54 : 42);
          cameraLookAtPos.set(0, 0, 0);
        }

        camera.position.lerp(cameraTargetPos, 0.06);
        currentLookAt.lerp(cameraLookAtPos, 0.06);
        camera.lookAt(currentLookAt);

        if (starField) {
          starField.rotation.y += 0.00008;
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', onWindowResize);
    }

    // ==========================================
    // PLANET SELECTION & ZOOM FUNCTIONS
    // ==========================================
    function selectPlanetByName(name) {
      const found = celestialBodies.find(b => b.config.name === name);
      if (!found) return;

      focusedBody = found;
      isOrbitOverview = false;

      // Update UI Header Badge (Clean: No 2K text)
      activePlanetName.textContent = found.config.label;
      activePlanetDot.style.backgroundColor = '#' + found.config.color.toString(16).padStart(6, '0');
      orbitViewBtn.classList.remove('hidden');
      orbitViewBtn.classList.add('flex');

      // Reset rotation controls
      focusedPlanetRotation = { x: 0, y: found.mesh.rotation.y };
    }

    function zoomToSolarOrbit() {
      focusedBody = null;
      isOrbitOverview = true;
      activePlanetName.textContent = "Solar System";
      activePlanetDot.style.backgroundColor = '#ff6600';
      orbitViewBtn.classList.remove('flex');
      orbitViewBtn.classList.add('hidden');
    }

    // ==========================================
    // AUTHENTIC FIERY ORANGE SUN & PLANET TEXTURES
    // ==========================================
    function generatePlanetTexture(name, baseHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      if (name === 'sun') {
        // Deep Blazing Solar Orange Plasma Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#ff3300');
        grad.addColorStop(0.25, '#ff6600');
        grad.addColorStop(0.5, '#ff8800');
        grad.addColorStop(0.75, '#ff4400');
        grad.addColorStop(1, '#cc2200');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);

        // Blazing Solar Granulation, Prominences & Sunspots
        for (let i = 0; i < 600; i++) {
          ctx.fillStyle = 'rgba(255, 200, 50, ' + (Math.random() * 0.45) + ')';
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 30 + 5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Sunspots
        for (let i = 0; i < 15; i++) {
          ctx.fillStyle = 'rgba(80, 15, 0, 0.7)';
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 14 + 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'mercury') {
        // Silvery-Gray Cratered Regolith
        ctx.fillStyle = '#8f9499';
        ctx.fillRect(0, 0, 1024, 512);
        for (let i = 0; i < 350; i++) {
          ctx.fillStyle = 'rgba(40, 45, 50, 0.4)';
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 20 + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'venus') {
        // Golden-Cream Dense Cloud Atmosphere
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.5, '#eab308');
        grad.addColorStop(1, '#ca8a04');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
        for (let i = 0; i < 60; i++) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.beginPath();
          ctx.ellipse(Math.random() * 1024, Math.random() * 512, Math.random() * 160 + 50, Math.random() * 25 + 5, 0.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'earth') {
        // Vibrant Blue Ocean & Green Continents
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#16a34a';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 110 + 40, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        for (let i = 0; i < 60; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * 1024, Math.random() * 512, Math.random() * 130 + 30, Math.random() * 20 + 5, Math.random() * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'moon') {
        // Lunar Gray with Dark Basaltic Maria
        ctx.fillStyle = '#b8b8b8';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = 'rgba(45, 45, 50, 0.65)';
        for (let i = 0; i < 15; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 90 + 30, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'mars') {
        // Rusty Crimson-Ochre Red Planet
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#7f1d1d';
        for (let i = 0; i < 90; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 45 + 10, 0, Math.PI * 2);
          ctx.fill();
        }
        // Polar Ice Cap
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1024, 35);
      } else if (name === 'jupiter') {
        // Butterscotch & Terracotta Gas Bands with Great Red Spot
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#78350f');
        grad.addColorStop(0.2, '#d97706');
        grad.addColorStop(0.35, '#fde68a');
        grad.addColorStop(0.5, '#b45309');
        grad.addColorStop(0.7, '#fef3c7');
        grad.addColorStop(0.85, '#92400e');
        grad.addColorStop(1, '#78350f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
        // Great Red Spot
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.ellipse(620, 310, 55, 32, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (name === 'saturn') {
        // Golden Gas Bands
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#ca8a04');
        grad.addColorStop(0.3, '#fef08a');
        grad.addColorStop(0.6, '#eab308');
        grad.addColorStop(1, '#a16207');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
      } else {
        // Uranus / Neptune (Aquamarine / Azure Blue)
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#0284c7');
        grad.addColorStop(0.5, '#38bdf8');
        grad.addColorStop(1, '#0369a1');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
      }

      return new THREE.CanvasTexture(canvas);
    }

    // ==========================================
    // POINTER DRAG & RAYCASTING PLANET TAP
    // ==========================================
    function setupSpaceInteractions(canvas) {
      let pointerDownPos = { x: 0, y: 0 };
      let dragDistance = 0;

      function onPointerDown(e) {
        if (!inSpaceMode) return;
        isDragging = true;
        isUserInteracting = true;
        dragDistance = 0;
        clearTimeout(userInteractionTimeout);

        previousPointer = { x: e.clientX, y: e.clientY };
        pointerDownPos = { x: e.clientX, y: e.clientY };
      }

      function onPointerMove(e) {
        if (!isDragging || !inSpaceMode) return;

        const deltaX = e.clientX - previousPointer.x;
        const deltaY = e.clientY - previousPointer.y;
        dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

        if (focusedBody) {
          focusedPlanetRotation.y += deltaX * 0.007;
          focusedPlanetRotation.x += deltaY * 0.007;
          focusedPlanetRotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, focusedPlanetRotation.x));
        }

        previousPointer = { x: e.clientX, y: e.clientY };
      }

      function onPointerUp(e) {
        if (!inSpaceMode) return;
        isDragging = false;

        // If it was a tap/click without dragging, raycast to select planet directly from 3D space
        if (dragDistance < 8) {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const meshes = celestialBodies.map(b => b.mesh);
          const intersects = raycaster.intersectObjects(meshes, true);

          if (intersects.length > 0) {
            let hit = intersects[0].object;
            while (hit.parent && !hit.userData.config) {
              hit = hit.parent;
            }
            if (hit.userData && hit.userData.config) {
              selectPlanetByName(hit.userData.config.name);
            }
          }
        }

        clearTimeout(userInteractionTimeout);
        userInteractionTimeout = setTimeout(() => {
          isUserInteracting = false;
        }, 3000);
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
  </script>
