<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universe — See the shape of the noise</title>
  <meta name="description" content="Explore all 9 moving planets in real-time 3D orbit with photorealistic 2K NASA textures.">
  
  <!-- Tailwind CSS, Three.js, & Iconify -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

    :root {
      --bg: #000000;
      --fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #000000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-serif-instrument {
      font-family: 'Instrument Serif', serif;
    }

    /* Video Background */
    #hero-video {
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform, opacity;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .liquid-glass {
      background: rgba(0, 0, 0, 0.35);
      background-blend-mode: luminosity;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.18) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.18) 80%,
        rgba(255, 255, 255, 0.5) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Transition states */
    .view-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(-10px);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .view-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #space-canvas {
      touch-action: none;
      cursor: grab;
    }
    #space-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-black text-white selection:bg-white selection:text-black font-sans">
  <div class="h-[100dvh] max-h-[100dvh] w-full flex flex-col justify-between overflow-hidden relative">
    
    <!-- 1. Background Video (Boy standing looking up at the sky) -->
    <video id="hero-video" class="absolute inset-0 w-full h-full object-cover object-bottom pointer-events-none z-0"
           muted autoplay loop playsinline preload="auto"></video>

    <!-- 2. Interactive 3D Solar System & 2K Planet Canvas -->
    <canvas id="space-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none opacity-0 transition-opacity duration-1000"></canvas>

    <!-- Top Navbar -->
    <header class="relative z-30 px-3 sm:px-6 pt-3 sm:pt-4 md:pt-6 shrink-0">
      <div class="liquid-glass rounded-full max-w-5xl mx-auto pl-4 pr-2 py-1.5 md:pl-6 md:pr-2.5 md:py-2 flex items-center justify-between">
        <!-- Left Group -->
        <div class="flex items-center gap-2">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-5 h-5 md:w-6 md:h-6 shrink-0">
            <path d="M4.21 16.5 A9 9 0 0 1 16.5 4.21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16.5 4.21 A9 9 0 0 1 19.79 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 2.3"/>
            <path d="M19.79 16.5 A9 9 0 0 1 4.21 16.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 4.7"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          </svg>
          <span class="font-semibold text-base md:text-lg tracking-tight">Universe</span>
        </div>

        <!-- Center Active Planet Badge (Shown in Space Mode) -->
        <div id="active-planet-badge" class="hidden items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs sm:text-sm font-medium text-white shadow-lg">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="active-planet-name">9 Planets Moving in Orbit</span>
        </div>

        <!-- Right Group -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Zoom to Orbit View Button (Shown when inspecting a planet) -->
          <button id="orbit-view-btn" onclick="zoomToSolarOrbit()" class="hidden liquid-glass rounded-full px-3 py-1 sm:px-4 sm:py-1.5 text-xs sm:text-sm font-medium text-white/90 hover:text-white items-center gap-1.5 transition hover:bg-white/10">
            <iconify-icon icon="lucide:orbit" class="text-sm"></iconify-icon>
            <span>Orbit View</span>
          </button>

          <!-- Main Action Button -->
          <button id="main-action-btn" onclick="toggleUniverseMode()" class="bg-white rounded-full px-4 py-1.5 md:px-5 md:py-2 text-black text-xs md:text-sm font-semibold whitespace-nowrap hover:scale-105 active:scale-95 transition-transform shadow-lg">
            Enter Universe
          </button>
        </div>
      </div>
    </header>

    <!-- Center Hero View (Landing with Boy) -->
    <main id="hero-view" class="relative z-30 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-2 text-center my-auto w-full max-w-4xl mx-auto shrink min-h-0 view-visible">
      <h1 class="text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-serif-instrument tracking-tight leading-[1.1] md:whitespace-nowrap mb-3 md:mb-4 px-1"
          style="text-shadow: 0 0 54px rgba(0, 0, 0, 0.8), 0 4px 24px rgba(0, 0, 0, 0.6);">
        See the shape of the <em class="italic">universe</em>
      </h1>
      
      <p class="text-white/80 text-xs sm:text-sm md:text-base leading-relaxed max-w-xl md:whitespace-nowrap mb-8 md:mb-10 px-3"
         style="text-shadow: 0 0 28px rgba(0, 0, 0, 0.7), 0 1px 10px rgba(0, 0, 0, 0.5);">
        Observe all 9 moving planets in real-time orbit. Tap any planet in space to inspect with stationary 2K texture.
      </p>

      <!-- Action Button Pill -->
      <div class="max-w-xs sm:max-w-sm w-full px-2">
        <button onclick="enterUniverse()"
                class="w-full liquid-glass rounded-full p-2 pl-6 pr-2.5 flex items-center justify-between gap-3 shadow-2xl hover:scale-105 active:scale-95 transition-all group">
          <div class="flex items-center gap-2.5 text-left">
            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
            <span class="text-xs sm:text-sm text-white font-medium">Enter Universe</span>
          </div>
          <div class="bg-white rounded-full p-2.5 text-black flex items-center justify-center group-hover:translate-x-0.5 transition-transform">
            <iconify-icon icon="lucide:arrow-up-right" class="text-base"></iconify-icon>
          </div>
        </button>
      </div>
    </main>

    <!-- Bottom Instruction Hint (Visible in Space Mode, completely clean without buttons) -->
    <div id="space-tap-hint" class="relative z-30 px-4 pb-4 pt-1 text-center hidden opacity-0 transition-opacity duration-700">
      <div class="inline-flex items-center gap-2 text-xs text-white/70 px-4 py-1.5 rounded-full liquid-glass">
        <iconify-icon icon="lucide:pointer" class="text-sm text-white animate-pulse"></iconify-icon>
        <span id="hint-text">Tap any planet in space to inspect in 2K</span>
      </div>
    </div>

    <!-- Empty Spacer for Hero view -->
    <div id="hero-spacer" class="h-6 shrink-0 relative z-20"></div>
  </div>

  <script>
    // Video Setup
    const video = document.getElementById('hero-video');
    video.src = "https://designerstephen.github.io/public-assets/videos/observe-hero.mp4";
    video.playbackRate = 0.5;

    let inSpaceMode = false;
    const heroView = document.getElementById('hero-view');
    const spaceCanvas = document.getElementById('space-canvas');
    const mainActionBtn = document.getElementById('main-action-btn');
    const activePlanetBadge = document.getElementById('active-planet-badge');
    const activePlanetName = document.getElementById('active-planet-name');
    const orbitViewBtn = document.getElementById('orbit-view-btn');
    const spaceTapHint = document.getElementById('space-tap-hint');
    const hintText = document.getElementById('hint-text');
    const heroSpacer = document.getElementById('hero-spacer');

    function toggleUniverseMode() {
      if (inSpaceMode) {
        exitUniverse();
      } else {
        enterUniverse();
      }
    }

    function enterUniverse() {
      inSpaceMode = true;

      // 1. Hide Hero view smoothly
      heroView.classList.remove('view-visible');
      heroView.classList.add('view-hidden');

      // 2. Animate background video upward & fade into pure 3D space
      video.style.transform = 'scale(1.8) translateY(-30%)';
      video.style.opacity = '0';

      // 3. Make 3D space canvas interactive and visible
      spaceCanvas.classList.remove('pointer-events-none');
      spaceCanvas.classList.add('pointer-events-auto');
      spaceCanvas.classList.remove('opacity-0');
      spaceCanvas.classList.add('opacity-100');

      mainActionBtn.textContent = "Back to Earth";
      activePlanetBadge.classList.remove('hidden');
      activePlanetBadge.classList.add('flex');
      
      heroSpacer.classList.add('hidden');
      spaceTapHint.classList.remove('hidden');
      setTimeout(() => {
        spaceTapHint.classList.remove('opacity-0');
      }, 100);

      if (!threeInitialized) {
        initThreeSpace();
      }

      // Start in full 9-Planet Solar System Orbit View
      zoomToSolarOrbit();
    }

    function exitUniverse() {
      inSpaceMode = false;

      // Reset video
      video.style.transform = 'translate3d(0, 0, 0) scale(1)';
      video.style.opacity = '1';

      // Hide canvas
      spaceCanvas.classList.remove('pointer-events-auto');
      spaceCanvas.classList.add('pointer-events-none');
      spaceCanvas.classList.remove('opacity-100');
      spaceCanvas.classList.add('opacity-0');

      mainActionBtn.textContent = "Enter Universe";
      activePlanetBadge.classList.remove('flex');
      activePlanetBadge.classList.add('hidden');
      orbitViewBtn.classList.remove('flex');
      orbitViewBtn.classList.add('hidden');
      
      spaceTapHint.classList.add('opacity-0');
      setTimeout(() => {
        spaceTapHint.classList.add('hidden');
        heroSpacer.classList.remove('hidden');
      }, 300);

      // Show Hero view
      heroView.classList.remove('view-hidden');
      heroView.classList.add('view-visible');
    }

    // ==========================================
    // THREE.JS 9-PLANET SOLAR SYSTEM & 2K TEXTURES
    // ==========================================
    let threeInitialized = false;
    let scene, camera, renderer, raycaster, mouse;
    let starField;
    let celestialBodies = [];
    let focusedBody = null;
    let isOrbitOverview = true;

    // Camera target animation
    let cameraTargetPos = new THREE.Vector3(0, 36, 44);
    let cameraLookAtPos = new THREE.Vector3(0, 0, 0);
    let currentLookAt = new THREE.Vector3(0, 0, 0);

    // Touch & Drag rotation on focused planet
    let isDragging = false;
    let previousPointer = { x: 0, y: 0 };
    let focusedPlanetRotation = { x: 0, y: 0 };
    let isUserInteracting = false;
    let userInteractionTimeout = null;

    // 9 Planet Specs (Sun + 8 Planetary bodies)
    const PLANET_CONFIGS = [
      { name: 'sun', label: 'Sun (Surya)', size: 3.2, orbitRadius: 0, orbitSpeed: 0, color: 0xffa500, emissive: 0xff8800, texture: 'sun_2k.jpg' },
      { name: 'mercury', label: 'Mercury (Budha)', size: 0.7, orbitRadius: 6.5, orbitSpeed: 0.024, color: 0x9e9e9e, texture: 'mercury_2k.jpg' },
      { name: 'venus', label: 'Venus (Shukra)', size: 1.1, orbitRadius: 10.0, orbitSpeed: 0.018, color: 0xe5c158, texture: 'venus_2k.jpg' },
      { name: 'earth', label: 'Earth (Prithvi)', size: 1.25, orbitRadius: 14.5, orbitSpeed: 0.014, color: 0x2563eb, texture: 'earth_2k.jpg' },
      { name: 'moon', label: 'Moon (Chandra)', size: 0.65, orbitRadius: 17.5, orbitSpeed: 0.013, color: 0xd4d4d4, texture: 'moon_2k.jpg' },
      { name: 'mars', label: 'Mars (Mangala)', size: 0.85, orbitRadius: 21.5, orbitSpeed: 0.010, color: 0xef4444, texture: 'mars_2k.jpg' },
      { name: 'jupiter', label: 'Jupiter (Guru)', size: 2.2, orbitRadius: 27.5, orbitSpeed: 0.007, color: 0xb45309, texture: 'jupiter_2k.jpg' },
      { name: 'saturn', label: 'Saturn (Shani)', size: 1.9, orbitRadius: 34.0, orbitSpeed: 0.005, color: 0xd97706, hasRing: true, texture: 'saturn_2k.jpg' },
      { name: 'uranus', label: 'Uranus', size: 1.4, orbitRadius: 40.5, orbitSpeed: 0.0035, color: 0x06b6d4, texture: 'uranus_2k.jpg' }
    ];

    function initThreeSpace() {
      threeInitialized = true;
      const canvas = document.getElementById('space-canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
      camera.position.set(0, 36, 44);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // 1. COSMIC STARFIELD
      const starGeo = new THREE.BufferGeometry();
      const starCount = 3200;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = (Math.random() - 0.5) * 900;
        starPositions[i + 1] = (Math.random() - 0.5) * 900;
        starPositions[i + 2] = (Math.random() - 0.5) * 900;

        const c = Math.random();
        if (c > 0.85) { starColors[i] = 0.8; starColors[i+1] = 0.9; starColors[i+2] = 1.0; }
        else if (c > 0.7) { starColors[i] = 1.0; starColors[i+1] = 0.85; starColors[i+2] = 0.65; }
        else { starColors[i] = 0.95; starColors[i+1] = 0.95; starColors[i+2] = 0.95; }
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
      starField = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.9 }));
      scene.add(starField);

      // 2. CELESTIAL LIGHTING
      const ambientLight = new THREE.AmbientLight(0x222233, 0.85);
      scene.add(ambientLight);

      const sunPointLight = new THREE.PointLight(0xffffff, 3.2, 500);
      sunPointLight.position.set(0, 0, 0);
      scene.add(sunPointLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.6);
      directionalLight.position.set(20, 20, 20);
      scene.add(directionalLight);

      // 3. TEXTURE LOADER & 9 PLANET MESHES
      const textureLoader = new THREE.TextureLoader();
      textureLoader.setCrossOrigin('anonymous');

      PLANET_CONFIGS.forEach((config) => {
        // Orbital Pivot Group
        const orbitGroup = new THREE.Group();
        scene.add(orbitGroup);

        // Glowing Orbital Path Ring
        if (config.orbitRadius > 0) {
          const ringGeo = new THREE.RingGeometry(config.orbitRadius - 0.05, config.orbitRadius + 0.05, 128);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.09, side: THREE.DoubleSide });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.rotation.x = Math.PI / 2;
          scene.add(ringMesh);
        }

        // Procedural Base Texture (Guarantees instant realistic render)
        const proceduralTex = generatePlanetTexture(config.name, config.color);

        // Planet Sphere Geometry & Material
        const geo = new THREE.SphereGeometry(config.size, 64, 64);
        let mat;

        if (config.name === 'sun') {
          mat = new THREE.MeshStandardMaterial({
            map: proceduralTex,
            emissive: 0xff7700,
            emissiveIntensity: 0.9,
            roughness: 0.3
          });
        } else {
          mat = new THREE.MeshStandardMaterial({
            map: proceduralTex,
            bumpMap: proceduralTex,
            bumpScale: 0.045,
            roughness: 0.85,
            metalness: 0.05
          });
        }

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(config.orbitRadius, 0, 0);
        mesh.userData = { config: config, currentAngle: Math.random() * Math.PI * 2 };
        orbitGroup.add(mesh);

        // Saturn Ring
        if (config.hasRing) {
          const sRingGeo = new THREE.RingGeometry(config.size * 1.4, config.size * 2.3, 64);
          const sRingMat = new THREE.MeshBasicMaterial({ color: 0xd4c29d, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
          const sRing = new THREE.Mesh(sRingGeo, sRingMat);
          sRing.rotation.x = Math.PI / 2.3;
          mesh.add(sRing);
        }

        // Asynchronously load genuine 2K Texture pack
        textureLoader.load(
          `./assets/${config.texture}`,
          (tex) => {
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            tex.generateMipmaps = true;
            mat.map = tex;
            if (config.name !== 'sun') {
              mat.bumpMap = tex;
            }
            mat.needsUpdate = true;
          }
        );

        celestialBodies.push({
          config: config,
          mesh: mesh,
          orbitGroup: orbitGroup,
          material: mat
        });
      });

      // 4. INTERACTIVE POINTER & CLICK/TAP LISTENERS
      setupSpaceInteractions(canvas);

      // 5. RENDER & ORBITAL ANIMATION LOOP
      function animate() {
        requestAnimationFrame(animate);

        // Animate Planet Orbits & Self-Rotations
        celestialBodies.forEach(body => {
          // If a planet is currently selected/enlarged, IT STOPS MOVING in orbit so user can inspect it comfortably!
          if (focusedBody === body) {
            // Selected planet is stationary in orbit. User can freely drag & rotate its sphere.
          } else {
            // Self-rotation on its axis for all other planets
            body.mesh.rotation.y += 0.008;

            // Orbital Revolution around Sun for non-selected planets
            if (body.config.orbitRadius > 0) {
              body.mesh.userData.currentAngle += body.config.orbitSpeed * 0.35;
              const angle = body.mesh.userData.currentAngle;
              body.mesh.position.x = Math.cos(angle) * body.config.orbitRadius;
              body.mesh.position.z = Math.sin(angle) * body.config.orbitRadius;
            }
          }
        });

        // Camera Smooth Lerp to Focused Planet or Orbit Overview
        if (focusedBody) {
          const worldPos = new THREE.Vector3();
          focusedBody.mesh.getWorldPosition(worldPos);

          // Calculate ideal camera distance to enlarge the stationary planet and fit mobile
          const isMobile = window.innerWidth < 768;
          const distMultiplier = isMobile ? 3.3 : 2.7;
          const camDistance = Math.max(2.8, focusedBody.config.size * distMultiplier);

          cameraTargetPos.set(worldPos.x, worldPos.y + 0.3, worldPos.z + camDistance);
          cameraLookAtPos.copy(worldPos);

          // Apply user touch rotation to the stationary focused planet
          focusedBody.mesh.rotation.y += (focusedPlanetRotation.y - focusedBody.mesh.rotation.y) * 0.1;
          focusedBody.mesh.rotation.x += (focusedPlanetRotation.x - focusedBody.mesh.rotation.x) * 0.1;
        } else if (isOrbitOverview) {
          // Wide angle view showing all 9 moving planets in real-time orbit
          const isMobile = window.innerWidth < 768;
          cameraTargetPos.set(0, isMobile ? 52 : 38, isMobile ? 48 : 42);
          cameraLookAtPos.set(0, 0, 0);
        }

        camera.position.lerp(cameraTargetPos, 0.06);
        currentLookAt.lerp(cameraLookAtPos, 0.06);
        camera.lookAt(currentLookAt);

        if (starField) {
          starField.rotation.y += 0.0001;
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', onWindowResize);
    }

    // ==========================================
    // PLANET SELECTION & ZOOM FUNCTIONS
    // ==========================================
    function selectPlanetByName(name) {
      const found = celestialBodies.find(b => b.config.name === name);
      if (!found) return;

      focusedBody = found;
      isOrbitOverview = false;

      // Update UI Header Badge
      activePlanetName.textContent = `${found.config.label} • Stationary 2K View`;
      orbitViewBtn.classList.remove('hidden');
      orbitViewBtn.classList.add('flex');
      hintText.textContent = `Drag with finger or mouse to rotate ${found.config.label}`;

      // Reset rotation controls
      focusedPlanetRotation = { x: 0, y: found.mesh.rotation.y };
    }

    function zoomToSolarOrbit() {
      focusedBody = null;
      isOrbitOverview = true;
      activePlanetName.textContent = "9 Planets Moving in Orbit";
      orbitViewBtn.classList.remove('flex');
      orbitViewBtn.classList.add('hidden');
      hintText.textContent = "Tap any planet in space to enlarge and inspect";
    }

    // ==========================================
    // PROCEDURAL HIGH-RES TEXTURE GENERATORS (2K)
    // ==========================================
    function generatePlanetTexture(name, baseHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const color = '#' + baseHex.toString(16).padStart(6, '0');

      if (name === 'sun') {
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#ffcc00');
        grad.addColorStop(0.5, '#ff4400');
        grad.addColorStop(1, '#ff8800');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
        for (let i = 0; i < 400; i++) {
          ctx.fillStyle = 'rgba(255, 255, 200, ' + (Math.random() * 0.4) + ')';
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 40 + 5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'earth') {
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 25; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 100 + 40, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        for (let i = 0; i < 50; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * 1024, Math.random() * 512, Math.random() * 120 + 30, Math.random() * 20 + 5, Math.random() * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (name === 'jupiter') {
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#78350f');
        grad.addColorStop(0.2, '#d97706');
        grad.addColorStop(0.4, '#fef3c7');
        grad.addColorStop(0.6, '#b45309');
        grad.addColorStop(0.8, '#92400e');
        grad.addColorStop(1, '#78350f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#b91c1c';
        ctx.beginPath();
        ctx.ellipse(600, 320, 50, 30, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (name === 'mars') {
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#7f1d1d';
        for (let i = 0; i < 80; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 40 + 10, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1024, 40);
      } else {
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 1024, 512);
        for (let i = 0; i < 200; i++) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
          ctx.beginPath();
          ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 20 + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      return new THREE.CanvasTexture(canvas);
    }

    // ==========================================
    // POINTER DRAG & RAYCASTING PLANET TAP
    // ==========================================
    function setupSpaceInteractions(canvas) {
      let pointerDownPos = { x: 0, y: 0 };
      let dragDistance = 0;

      function onPointerDown(e) {
        if (!inSpaceMode) return;
        isDragging = true;
        isUserInteracting = true;
        dragDistance = 0;
        clearTimeout(userInteractionTimeout);

        previousPointer = { x: e.clientX, y: e.clientY };
        pointerDownPos = { x: e.clientX, y: e.clientY };
      }

      function onPointerMove(e) {
        if (!isDragging || !inSpaceMode) return;

        const deltaX = e.clientX - previousPointer.x;
        const deltaY = e.clientY - previousPointer.y;
        dragDistance += Math.abs(deltaX) + Math.abs(deltaY);

        if (focusedBody) {
          focusedPlanetRotation.y += deltaX * 0.007;
          focusedPlanetRotation.x += deltaY * 0.007;
          focusedPlanetRotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, focusedPlanetRotation.x));
        }

        previousPointer = { x: e.clientX, y: e.clientY };
      }

      function onPointerUp(e) {
        if (!inSpaceMode) return;
        isDragging = false;

        // If it was a tap/click without dragging, raycast to select planet directly from 3D space
        if (dragDistance < 8) {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const meshes = celestialBodies.map(b => b.mesh);
          const intersects = raycaster.intersectObjects(meshes, true);

          if (intersects.length > 0) {
            let hit = intersects[0].object;
            while (hit.parent && !hit.userData.config) {
              hit = hit.parent;
            }
            if (hit.userData && hit.userData.config) {
              selectPlanetByName(hit.userData.config.name);
            }
          }
        }

        clearTimeout(userInteractionTimeout);
        userInteractionTimeout = setTimeout(() => {
          isUserInteracting = false;
        }, 3000);
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
  </script>
